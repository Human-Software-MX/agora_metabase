version: "3.9"

# Agora Metabase — production deployment for EasyPanel
#
# EasyPanel setup (from GitHub):
#   1. Create a new App in EasyPanel → Source: GitHub repo
#   2. Set build context to repository root (Dockerfile is at ./Dockerfile)
#   3. Add the services below as EasyPanel services, or deploy via this file
#      using "Docker Compose" app type.
#
# Required environment variables (set in EasyPanel service settings):
#   MB_DB_TYPE, MB_DB_HOST, MB_DB_PORT, MB_DB_DBNAME, MB_DB_USER, MB_DB_PASS
#   MB_SITE_URL
#   MB_EMBEDDING_SECRET_KEY  (64-char hex, generate with: openssl rand -hex 32)
#   MB_ENABLE_EMBEDDING_STATIC=true
#
# Optional:
#   MB_SEND_EMAIL_ON_FIRST_LOGIN_FROM_NEW_DEVICE=false
#   JAVA_TIMEZONE=America/Mexico_City

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MB_DB_DBNAME:-metabase}
      POSTGRES_USER: ${MB_DB_USER:-metabase}
      POSTGRES_PASSWORD: ${MB_DB_PASS}
    volumes:
      - metabase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_DB_USER:-metabase}"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MB_EDITION: oss
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${MB_DB_DBNAME:-metabase}
      MB_DB_USER: ${MB_DB_USER:-metabase}
      MB_DB_PASS: ${MB_DB_PASS}

      # Public URL — must match the domain EasyPanel proxies to this service
      MB_SITE_URL: ${MB_SITE_URL:-http://localhost:3000}

      # Static embedding (required for Agora BI integration)
      MB_ENABLE_EMBEDDING_STATIC: ${MB_ENABLE_EMBEDDING_STATIC:-true}
      MB_EMBEDDING_SECRET_KEY: ${MB_EMBEDDING_SECRET_KEY}

      # Optional tuning
      JAVA_TIMEZONE: ${JAVA_TIMEZONE:-UTC}
      MB_JETTY_HOST: 0.0.0.0
      MB_JETTY_PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  metabase-db:
